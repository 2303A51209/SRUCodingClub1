<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Attendance - SR University Coding Club">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Attendance | Team Dashboard</title>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading...</p>
    </div>
    <div class="dashboard" id="dashboard" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header"><a href="../../index.html" class="logo">
                    <div class="logo-icon">>_</div><span>srucc</span>
                </a><span class="badge"
                    style="background: var(--primary); color: white; font-size: 10px; padding: 2px 6px;">TEAM</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p><a href="/dashboards/team/index.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>Dashboard</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Manage</p><a href="/dashboards/team/events.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                        </svg>Events</a><a href="/dashboards/team/gallery.html" class="sidebar-link"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>Gallery</a><a href="/dashboards/team/announcements.html" class="sidebar-link"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>Announcements</a><a href="/dashboards/team/attendance.html"
                        class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>Attendance</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Personal</p><a href="/dashboards/team/profile.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>Profile</a>
                </div>
            </nav>
            <div class="sidebar-footer"><button class="btn btn-ghost w-full" id="logout-btn"><svg viewBox="0 0 24 24"
                        width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>Logout</button></div>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Attendance</h1>
                    <p class="dashboard-subtitle">Track event attendance</p>
                </div>
            </header>

            <!-- Select Event -->
            <section class="card mb-6">
                <div class="card-body">
                    <div class="form-group">
                        <label for="event-select">Select Event</label>
                        <select id="event-select" class="form-input">
                            <option value="">Choose an event...</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Attendance List -->
            <section class="card" id="attendance-section" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">Registered Members</h2>
                    <span class="badge" id="attendance-count">0 present</span>
                </div>
                <div class="card-body">
                    <div id="attendance-list" class="attendance-list"></div>
                </div>
                <div class="card-footer">
                    <button class="btn btn-primary" id="save-btn">Save Attendance</button>
                </div>
            </section>
        </main>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';
        store.initTheme();
        let events = [], members = [], attendance = {};
        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin', 'team'] });
            if (!allowed) return;
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';
            setupEventListeners();
            await loadEvents();
        }
        function setupEventListeners() {
            document.getElementById('event-select').addEventListener('change', loadAttendance);
            document.getElementById('save-btn').addEventListener('click', saveAttendance);
            document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
        }
        async function loadEvents() {
            const token = localStorage.getItem('sb_access_token');
            try {
                const response = await fetch('/api/v1/events?limit=50', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Failed');
                const result = await response.json();
                events = result.data || [];
                const select = document.getElementById('event-select');
                select.innerHTML = '<option value="">Choose an event...</option>' + events.map(e => `<option value="${e.id}">${e.title} - ${new Date(e.date).toLocaleDateString()}</option>`).join('');
            } catch (error) { showToast('Failed to load events', 'error'); }
        }
        async function loadAttendance() {
            const eventId = document.getElementById('event-select').value;
            const section = document.getElementById('attendance-section');
            if (!eventId) { section.style.display = 'none'; return; }

            const token = localStorage.getItem('sb_access_token');
            try {
                // Load users as members (simplified - would be event registrations in real app)
                const response = await fetch('/api/v1/admin/users?limit=50', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Failed');
                const result = await response.json();
                members = result.data || [];
                section.style.display = 'block';
                renderAttendance();
            } catch (error) { showToast('Failed to load members', 'error'); }
        }
        function renderAttendance() {
            const list = document.getElementById('attendance-list');
            if (!members.length) { list.innerHTML = '<p class="text-muted">No registered members</p>'; return; }
            list.innerHTML = members.map(m => `
                <label class="attendance-item">
                    <input type="checkbox" ${attendance[m.id] ? 'checked' : ''} onchange="toggleAttendance('${m.id}', this.checked)">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${m.email}" alt="" class="user-avatar-sm">
                    <div><p class="font-medium">${m.full_name || 'Member'}</p><p class="text-xs text-muted">${m.email}</p></div>
                </label>
            `).join('');
            updateCount();
        }
        window.toggleAttendance = function (id, present) {
            attendance[id] = present;
            updateCount();
        };
        function updateCount() {
            const present = Object.values(attendance).filter(Boolean).length;
            document.getElementById('attendance-count').textContent = `${present} present`;
        }
        async function saveAttendance() {
            showToast('Attendance saved', 'success');
            // In real app: POST to /api/v1/attendance endpoint
        }
        function showToast(message, type = 'info') { const container = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.className = `toast toast-${type}`; toast.textContent = message; container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10); setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000); }
        init();
    </script>
    <style>
        .attendance-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .attendance-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: background 0.2s;
        }

        .attendance-item:hover {
            background: var(--bg-surface-elevated);
        }

        .attendance-item input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        .user-avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3);
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        .card-footer {
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--glass-border);
        }

        .badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
        }

        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            z-index: 1100;
        }

        .toast {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s;
            margin-top: var(--space-2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast-error {
            border-color: var(--error);
            color: var(--error);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }
    </style>
</body>

</html>
