<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile - SR University Coding Club">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Profile | Member Dashboard</title>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading...</p>
    </div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../../index.html" class="logo">
                    <div class="logo-icon">>_</div><span>srucc</span>
                </a>
                <span class="badge"
                    style="background: var(--success); color: white; font-size: 10px; padding: 2px 6px;">MEMBER</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p>
                    <a href="/dashboards/member/index.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>Dashboard
                    </a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Explore</p>
                    <a href="/dashboards/member/events.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                        </svg>Events
                    </a>
                    <a href="/dashboards/member/gallery.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>Gallery
                    </a>
                    <a href="/dashboards/member/announcements.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>Announcements
                    </a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Personal</p>
                    <a href="/dashboards/member/profile.html" class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>Profile
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-ghost w-full" id="logout-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Profile</h1>
                    <p class="dashboard-subtitle">Manage your account</p>
                </div>
            </header>

            <!-- Profile Card -->
            <section class="card mb-6">
                <div class="card-body">
                    <div class="profile-header">
                        <div class="avatar-upload-wrapper">
                            <img id="profile-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default"
                                alt="Avatar" class="profile-avatar">
                            <label class="avatar-upload-overlay" for="avatar-input">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" />
                                    <circle cx="12" cy="13" r="4" />
                                </svg>
                                <span>Change Photo</span>
                            </label>
                            <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp,image/gif"
                                hidden>
                            <div class="avatar-upload-progress" id="avatar-progress" style="display: none;">
                                <div class="spinner spinner-sm"></div>
                            </div>
                        </div>
                        <div class="profile-info">
                            <h2 id="profile-name" class="profile-name">Loading...</h2>
                            <p id="profile-email" class="profile-email">...</p>
                            <span id="profile-role" class="role-badge role-member">Member</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Edit Profile -->
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Edit Profile</h2>
                </div>
                <div class="card-body">
                    <form id="profile-form" class="profile-form">
                        <div class="form-group">
                            <label for="full-name">Full Name</label>
                            <input type="text" id="full-name" class="form-input" placeholder="Your name">
                        </div>
                        <div class="form-group">
                            <label for="bio">Bio</label>
                            <textarea id="bio" class="form-input" rows="3"
                                placeholder="Tell us about yourself..."></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="github_url">GitHub URL</label>
                                <input type="url" id="github_url" class="form-input"
                                    placeholder="https://github.com/username">
                            </div>
                            <div class="form-group">
                                <label for="linkedin_url">LinkedIn URL</label>
                                <input type="url" id="linkedin_url" class="form-input"
                                    placeholder="https://linkedin.com/in/username">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="save-btn">
                            <span class="btn-text">Save Changes</span>
                            <div class="btn-loader spinner spinner-sm" style="display: none;"></div>
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';

        store.initTheme();

        let user = null;

        async function init() {
            const allowed = await routeGuard.check({ roles: ['member', 'team', 'admin'] });
            if (!allowed) return;

            // Redirect team/admin to their proper dashboards
            const userData = JSON.parse(localStorage.getItem('sb_user') || '{}');
            if (userData.role === 'team') {
                window.location.href = '/dashboards/team/profile.html';
                return;
            }
            if (userData.role === 'admin') {
                window.location.href = '/dashboards/admin/index.html';
                return;
            }

            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';

            await loadProfile();
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('profile-form').addEventListener('submit', saveProfile);
            document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
            document.getElementById('avatar-input').addEventListener('change', handleAvatarSelect);
        }

        async function loadProfile() {
            try {
                const token = localStorage.getItem('sb_access_token');

                const response = await fetch('/api/v1/users/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    user = result.data;
                    localStorage.setItem('sb_user', JSON.stringify(user));
                } else {
                    user = JSON.parse(localStorage.getItem('sb_user') || '{}');
                }

                renderProfile();
            } catch (error) {
                console.error('Error loading profile:', error);
                user = JSON.parse(localStorage.getItem('sb_user') || '{}');
                renderProfile();
            }
        }

        function renderProfile() {
            const avatarUrl = user.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email || 'default'}`;
            document.getElementById('profile-avatar').src = avatarUrl;
            document.getElementById('profile-name').textContent = user.full_name || user.user_metadata?.full_name || 'Member';
            document.getElementById('profile-email').textContent = user.email || '';
            document.getElementById('profile-role').textContent = user.role || 'member';
            document.getElementById('profile-role').className = `role-badge role-${user.role || 'member'}`;
            document.getElementById('full-name').value = user.full_name || user.user_metadata?.full_name || '';
            document.getElementById('bio').value = user.bio || '';
            document.getElementById('github_url').value = user.github_url || '';
            document.getElementById('linkedin_url').value = user.linkedin_url || '';
        }

        async function handleAvatarSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            if (!validTypes.includes(file.type)) {
                showToast('Invalid file type. Use JPEG, PNG, WebP, or GIF.', 'error');
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                showToast('File too large. Maximum 2MB.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64Data = event.target.result;
                document.getElementById('profile-avatar').src = base64Data;
                document.getElementById('avatar-progress').style.display = 'flex';

                try {
                    const token = localStorage.getItem('sb_access_token');
                    const response = await fetch('/api/v1/upload/avatar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ image: base64Data })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        user.avatar_url = result.data.avatar_url;
                        localStorage.setItem('sb_user', JSON.stringify(user));
                        document.getElementById('profile-avatar').src = result.data.avatar_url;
                        showToast('Avatar updated!', 'success');
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    showToast('Failed to upload avatar', 'error');
                } finally {
                    document.getElementById('avatar-progress').style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile(e) {
            e.preventDefault();

            const btn = document.getElementById('save-btn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoader = btn.querySelector('.btn-loader');

            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';

            const data = {
                full_name: document.getElementById('full-name').value,
                bio: document.getElementById('bio').value,
                github_url: document.getElementById('github_url').value || null,
                linkedin_url: document.getElementById('linkedin_url').value || null
            };

            try {
                const token = localStorage.getItem('sb_access_token');
                const response = await fetch('/api/v1/users/me', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    user = { ...user, ...result.data };
                    localStorage.setItem('sb_user', JSON.stringify(user));
                    renderProfile();
                    showToast('Profile updated!', 'success');
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                console.error('Save error:', error);
                showToast('Failed to save profile', 'error');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        init();
    </script>

    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: var(--space-6);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-1);
        }

        .profile-email {
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .avatar-upload-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: var(--radius-full);
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 3px solid var(--primary);
            border-radius: var(--radius-full);
        }

        .avatar-upload-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            opacity: 0;
            transition: opacity 0.2s ease;
            cursor: pointer;
            border-radius: var(--radius-full);
        }

        .avatar-upload-overlay span {
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
        }

        .avatar-upload-wrapper:hover .avatar-upload-overlay {
            opacity: 1;
        }

        .avatar-upload-progress {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: var(--radius-full);
        }

        .role-badge {
            display: inline-flex;
            padding: var(--space-1) var(--space-3);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            border-radius: var(--radius-full);
            text-transform: capitalize;
        }

        .role-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .role-team {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .role-member {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .profile-form {
            max-width: 500px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3);
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.form-input {
            resize: vertical;
        }

        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            z-index: 1100;
        }

        .toast {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s;
            margin-top: var(--space-2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast-error {
            border-color: var(--error);
            color: var(--error);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }
    </style>
</body>

</html>
