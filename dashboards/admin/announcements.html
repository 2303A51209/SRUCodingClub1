<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Announcements - SR University Coding Club">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Announcements | Admin Dashboard</title>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading announcements...</p>
    </div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../../index.html" class="logo">
                    <div class="logo-icon">>_</div>
                    <span>srucc</span>
                </a>
                <span class="badge"
                    style="background: var(--error); color: white; font-size: 10px; padding: 2px 6px;">ADMIN</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p>
                    <a href="/dashboards/admin/index.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>
                        Dashboard
                    </a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Manage</p>
                    <a href="/dashboards/admin/users.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                        </svg>
                        Users
                    </a>
                    <a href="/dashboards/admin/events.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                        </svg>
                        Events
                    </a>
                    <a href="/dashboards/admin/gallery.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>
                        Gallery
                    </a>
                    <a href="/dashboards/admin/announcements.html" class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>
                        Announcements
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-ghost w-full" id="logout-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Announcements</h1>
                    <p class="dashboard-subtitle">Broadcast messages to members</p>
                </div>
                <button class="btn btn-primary" id="create-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    New Announcement
                </button>
            </header>

            <!-- Filter -->
            <section class="card mb-6">
                <div class="card-body">
                    <div class="filters-row">
                        <select id="priority-filter" class="filter-select">
                            <option value="">All Priority</option>
                            <option value="high">High</option>
                            <option value="normal">Normal</option>
                            <option value="low">Low</option>
                        </select>
                        <span class="filter-stats">Total: <span id="total-count">0</span> announcements</span>
                    </div>
                </div>
            </section>

            <!-- Announcements List -->
            <section class="card">
                <div class="card-body">
                    <div id="announcements-list" class="announcements-list">
                        <div class="loading-placeholder">Loading...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="modal" style="display: none;">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="modal-title">New Announcement</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="form">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" class="form-input" required placeholder="Important Update">
                    </div>
                    <div class="form-group">
                        <label for="content">Content *</label>
                        <textarea id="content" class="form-input" rows="5" required
                            placeholder="Write your announcement..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority" class="form-input">
                                <option value="normal">Normal</option>
                                <option value="high">High</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="expires">Expires At (optional)</label>
                            <input type="datetime-local" id="expires" class="form-input">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="delete-modal" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Delete Announcement</h3>
                <button class="modal-close" id="delete-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this announcement?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="delete-cancel">Cancel</button>
                <button class="btn btn-danger" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';

        store.initTheme();

        let items = [];
        let editingId = null;
        let deletingId = null;

        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin'] });
            if (!allowed) return;

            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';

            setupEventListeners();
            await loadItems();
        }

        function setupEventListeners() {
            document.getElementById('create-btn').addEventListener('click', () => openModal());
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('modal-cancel').addEventListener('click', closeModal);
            document.getElementById('form').addEventListener('submit', handleSubmit);
            document.getElementById('priority-filter').addEventListener('change', loadItems);

            document.getElementById('delete-close').addEventListener('click', closeDeleteModal);
            document.getElementById('delete-cancel').addEventListener('click', closeDeleteModal);
            document.getElementById('delete-confirm').addEventListener('click', confirmDelete);

            document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
        }

        async function loadItems() {
            const token = localStorage.getItem('sb_access_token');
            const priority = document.getElementById('priority-filter').value;

            try {
                const params = new URLSearchParams({ limit: 50 });
                if (priority) params.append('priority', priority);

                const response = await fetch(`/api/v1/announcements?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed');

                const result = await response.json();
                items = result.data || [];

                document.getElementById('total-count').textContent = items.length;
                renderItems();

            } catch (error) {
                console.error(error);
                showToast('Failed to load', 'error');
            }
        }

        function renderItems() {
            const list = document.getElementById('announcements-list');

            if (!items.length) {
                list.innerHTML = `<div class="empty-state"><p>No announcements yet</p><button class="btn btn-primary mt-4" onclick="document.getElementById('create-btn').click()">Create First</button></div>`;
                return;
            }

            list.innerHTML = items.map(item => `
                <article class="announcement-card priority-${item.priority || 'normal'}">
                    <div class="announcement-header">
                        <h3 class="announcement-title">${item.title}</h3>
                        <span class="priority-badge priority-${item.priority || 'normal'}">${item.priority || 'normal'}</span>
                    </div>
                    <p class="announcement-content">${item.content}</p>
                    <div class="announcement-meta">
                        <span>${formatDate(item.created_at)}</span>
                        ${item.expires_at ? `<span>Expires: ${formatDate(item.expires_at)}</span>` : ''}
                    </div>
                    <div class="announcement-actions">
                        <button class="btn btn-ghost btn-sm" onclick="editItem('${item.id}')">Edit</button>
                        <button class="btn btn-ghost btn-sm text-error" onclick="deleteItem('${item.id}')">Delete</button>
                    </div>
                </article>
            `).join('');
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function openModal(item = null) {
            editingId = item?.id || null;
            document.getElementById('modal-title').textContent = item ? 'Edit Announcement' : 'New Announcement';

            if (item) {
                document.getElementById('title').value = item.title || '';
                document.getElementById('content').value = item.content || '';
                document.getElementById('priority').value = item.priority || 'normal';
                document.getElementById('expires').value = item.expires_at ? item.expires_at.slice(0, 16) : '';
            } else {
                document.getElementById('form').reset();
            }

            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            editingId = null;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const token = localStorage.getItem('sb_access_token');

            const data = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                priority: document.getElementById('priority').value,
            };

            const expires = document.getElementById('expires').value;
            if (expires) data.expires_at = new Date(expires).toISOString();

            try {
                const url = editingId ? `/api/v1/announcements/${editingId}` : '/api/v1/announcements';
                const response = await fetch(url, {
                    method: editingId ? 'PATCH' : 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Failed');

                showToast(editingId ? 'Updated' : 'Published', 'success');
                closeModal();
                await loadItems();

            } catch (error) {
                showToast('Failed to save', 'error');
            }
        }

        window.editItem = function (id) {
            const item = items.find(i => i.id === id);
            if (item) openModal(item);
        };

        window.deleteItem = function (id) {
            deletingId = id;
            document.getElementById('delete-modal').style.display = 'flex';
        };

        function closeDeleteModal() {
            document.getElementById('delete-modal').style.display = 'none';
            deletingId = null;
        }

        async function confirmDelete() {
            const token = localStorage.getItem('sb_access_token');
            try {
                const response = await fetch(`/api/v1/announcements/${deletingId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed');

                showToast('Deleted', 'success');
                closeDeleteModal();
                await loadItems();

            } catch (error) {
                showToast('Failed to delete', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        init();
    </script>

    <style>
        .filters-row {
            display: flex;
            gap: var(--space-4);
            align-items: center;
        }

        .filter-select {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            color: var(--text-primary);
        }

        .filter-stats {
            margin-left: auto;
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .announcement-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            transition: all var(--transition-fast);
        }

        .announcement-card:hover {
            border-color: var(--primary);
        }

        .announcement-card.priority-high {
            border-left: 4px solid var(--error);
        }

        .announcement-card.priority-normal {
            border-left: 4px solid var(--primary);
        }

        .announcement-card.priority-low {
            border-left: 4px solid var(--text-muted);
        }

        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-3);
        }

        .announcement-title {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
        }

        .priority-badge {
            font-size: var(--text-xs);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            text-transform: capitalize;
        }

        .priority-badge.priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .priority-badge.priority-normal {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .priority-badge.priority-low {
            background: rgba(107, 114, 128, 0.2);
            color: #6b7280;
        }

        .announcement-content {
            color: var(--text-secondary);
            margin-bottom: var(--space-4);
            line-height: 1.6;
        }

        .announcement-meta {
            display: flex;
            gap: var(--space-4);
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-bottom: var(--space-4);
        }

        .announcement-actions {
            display: flex;
            gap: var(--space-2);
            border-top: 1px solid var(--glass-border);
            padding-top: var(--space-3);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 400px;
        }

        .modal-lg {
            max-width: 550px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .modal-body {
            padding: var(--space-6);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--glass-border);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3);
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        textarea.form-input {
            resize: vertical;
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .text-error {
            color: var(--error);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-12);
        }

        .loading-placeholder {
            text-align: center;
            padding: var(--space-8);
            color: var(--text-muted);
        }

        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            z-index: 1100;
        }

        .toast {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s;
            margin-top: var(--space-2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast-error {
            border-color: var(--error);
            color: var(--error);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }

        .mt-4 {
            margin-top: var(--space-4);
        }
    </style>
</body>

</html>
