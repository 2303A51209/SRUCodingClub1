<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="You are offline - SR University Coding Club">

    <link rel="stylesheet" href="./css/main.css">

    <title>Offline | SR University Coding Club</title>
</head>

<body>
    <div class="bg-gradient-orbs" aria-hidden="true"></div>

    <main class="main-content full-height-content center">
        <div class="container center-text">
            <div class="card p-8" style="max-width: 480px; margin: 0 auto;">
                <div class="mb-6">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--text-muted)"
                        stroke-width="1.5" style="margin: 0 auto;">
                        <path
                            d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" />
                    </svg>
                </div>
                <h1 class="text-2xl mb-4">You're Offline</h1>
                <p class="text-secondary mb-6">
                    It looks like you've lost your internet connection.
                    Some features may be unavailable until you're back online.
                </p>
                <button onclick="location.reload()" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10" />
                        <polyline points="1 20 1 14 7 14" />
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                    </svg>
                    Try Again
                </button>
            </div>
        </div>
    </main>
</body>

</html>
