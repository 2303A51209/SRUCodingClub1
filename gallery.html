<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gallery - SR University Coding Club photos and memories.">

    <meta name="theme-color" content="#7c3aed">
    <link rel="stylesheet" href="./css/main.css">

    <title>Gallery | SR University Coding Club</title>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="bg-gradient-orbs" aria-hidden="true"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="./index.html" class="logo">
                <div class="logo-icon">>_</div>
                <span>srucc</span>
            </a>

            <nav class="nav-main" role="navigation" aria-label="Main navigation">
                <a href="./projects.html" class="nav-link">Projects</a>
                <a href="./learn.html" class="nav-link" style="display:none !important;">Learn</a>
                <!-- TEMPORARILY DISABLED -->
                <a href="./events.html" class="nav-link">Events</a>
                <a href="./gallery.html" class="nav-link active">Gallery</a>
                <a href="./team.html" class="nav-link">Team</a>
                <a href="./community.html" class="nav-link">Community</a>
            </nav>

            <div class="nav-actions">
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <path
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                </button>
                <!-- Auth Slot -->
                <div id="auth-actions" class="auth-actions"></div>
            </div>

            <button class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Page Header -->
        <section class="section page-header-section">
            <div class="container">
                <div class="page-header" data-animate>
                    <h1 class="page-title">
                        <span class="page-title-prefix">~/</span>gallery
                    </h1>
                    <p class="page-description">
                        Moments from hackathons, workshops, and build sessions — organized by events.
                    </p>
                </div>

                <!-- Filters -->
                <div class="gallery-filters" data-animate data-delay="1">
                    <button class="filter-btn active" data-filter="all">All Events</button>
                    <button class="filter-btn" data-filter="hackathon">Hackathons</button>
                    <button class="filter-btn" data-filter="workshop">Workshops</button>
                    <button class="filter-btn" data-filter="meetup">Meetups</button>
                    <button class="filter-btn" data-filter="celebration">Celebrations</button>
                </div>
            </div>
        </section>

        <!-- Bento Gallery -->
        <section class="section pt-0">
            <div class="container">
                <!-- Loading State -->
                <div id="gallery-loading" class="center-text py-12">
                    <div class="spinner spinner-lg"></div>
                    <p class="text-muted mt-4">Loading gallery...</p>
                </div>

                <!-- Empty State -->
                <div id="gallery-empty" class="center-text py-12" style="display: none;">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--text-muted)"
                        stroke-width="1" style="margin: 0 auto;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <h3 class="mt-4">No photos yet</h3>
                    <p class="text-muted">Photos from our events will appear here!</p>
                </div>

                <!-- Events Container -->
                <div class="events-gallery" id="events-gallery"></div>
            </div>
        </section>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox" style="display: none;">
        <button class="lightbox-close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <button class="lightbox-nav lightbox-next" aria-label="Next">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        </button>
        <div class="lightbox-content">
            <img src="" alt="" id="lightbox-img">
            <div class="lightbox-info">
                <span class="lightbox-badge" id="lightbox-badge"></span>
                <p class="lightbox-caption" id="lightbox-caption"></p>
                <span class="lightbox-counter" id="lightbox-counter"></span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="./gallery.html" class="footer-link">Gallery</a>
                <a href="./team.html" class="footer-link">Team</a>
                <a href="https://github.com/sr-coding-club" class="footer-link" target="_blank">GitHub</a>
            </div>
            <div class="footer-bottom">
                <p class="footer-copyright">
                    <span class="t-muted">// </span>Built by students, for students.
                </p>
            </div>
        </div>
    </footer>

    <script type="module">
        import './js/components/header-auth.js';
        import dataService from './js/core/data.js';
        import store from './js/core/store.js';
        import { escapeHtml } from './js/utils/security.js';

        // Initialize theme
        store.initTheme();
        document.documentElement.classList.add('js-ready');

        // State
        let currentFilter = 'all';
        let allPhotos = [];
        let currentLightboxIndex = 0;
        let currentEventPhotos = [];

        // DOM Elements
        const eventsGallery = document.getElementById('events-gallery');
        const loadingEl = document.getElementById('gallery-loading');
        const emptyEl = document.getElementById('gallery-empty');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxBadge = document.getElementById('lightbox-badge');
        const lightboxCounter = document.getElementById('lightbox-counter');

        // Animate elements
        function initAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('[data-animate]').forEach(el => observer.observe(el));
        }

        // Group photos by event
        function groupPhotosByEvent(photos) {
            const groups = {};
            photos.forEach(photo => {
                const eventName = photo.event_name || photo.category || 'Other';
                if (!groups[eventName]) {
                    groups[eventName] = {
                        name: eventName,
                        category: photo.category || 'other',
                        photos: []
                    };
                }
                groups[eventName].photos.push(photo);
            });
            return Object.values(groups);
        }

        // Get bento span class based on index
        function getBentoSpan(index, totalInGroup) {
            // Create varied bento layouts
            if (index === 0 && totalInGroup >= 4) {
                return 'bento-span-large'; // First image is large (2x2)
            } else if (index === 1 && totalInGroup >= 5) {
                return 'bento-span-wide'; // Second image is wide (2x1)
            } else if (index === 2 && totalInGroup >= 6) {
                return 'bento-span-tall'; // Third image is tall (1x2)
            }
            return 'bento-span-normal'; // Regular (1x1)
        }

        // Render a single bento item
        function renderBentoItem(photo, index, totalInGroup, eventIndex) {
            const spanClass = getBentoSpan(index, totalInGroup);
            const delay = (eventIndex * 0.1) + (index * 0.05);

            return `
                <div class="bento-item ${spanClass}" 
                     data-photo-id="${photo.id}" 
                     data-category="${escapeHtml(photo.category || '')}"
                     style="--delay: ${delay}s">
                    <div class="bento-item-inner">
                        <img src="${escapeHtml(photo.url)}" 
                             alt="${escapeHtml(photo.caption || '')}" 
                             loading="lazy"
                             class="bento-img">
                        <div class="bento-overlay">
                            <span class="bento-badge">${escapeHtml(photo.category || 'photo')}</span>
                            <h4 class="bento-title">${escapeHtml(photo.caption || '')}</h4>
                        </div>
                        <div class="bento-zoom">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="11" y1="8" x2="11" y2="14"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render an event group
        function renderEventGroup(eventGroup, eventIndex) {
            const photos = eventGroup.photos;
            const categoryClass = eventGroup.category.toLowerCase().replace(/\s+/g, '-');

            return `
                <div class="event-group" data-category="${escapeHtml(eventGroup.category)}">
                    <div class="event-header">
                        <div class="event-header-content">
                            <span class="event-category-badge event-category-${categoryClass}">${escapeHtml(eventGroup.category)}</span>
                            <h3 class="event-title">${escapeHtml(eventGroup.name)}</h3>
                            <span class="event-photo-count">${photos.length} photo${photos.length !== 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <div class="bento-grid bento-grid-${Math.min(photos.length, 4)}">
                        ${photos.slice(0, 6).map((photo, i) => renderBentoItem(photo, i, photos.length, eventIndex)).join('')}
                    </div>
                    ${photos.length > 6 ? `
                        <button class="event-show-more" data-event="${escapeHtml(eventGroup.name)}">
                            <span>+${photos.length - 6} more photos</span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    ` : ''}
                </div>
            `;
        }

        // Render gallery
        function renderGallery(photos) {
            if (photos.length === 0) {
                eventsGallery.innerHTML = '';
                emptyEl.style.display = 'block';
                return;
            }

            emptyEl.style.display = 'none';

            // Group photos by event
            const eventGroups = groupPhotosByEvent(photos);

            // Render each event group
            const html = eventGroups.map((group, index) => renderEventGroup(group, index)).join('');
            eventsGallery.innerHTML = html;

            // Add click handlers for bento items
            document.querySelectorAll('.bento-item').forEach(item => {
                item.addEventListener('click', () => {
                    const photoId = item.dataset.photoId;
                    const eventGroup = item.closest('.event-group');
                    const eventPhotos = Array.from(eventGroup.querySelectorAll('.bento-item'));
                    const photoIndex = eventPhotos.indexOf(item);

                    // Get photos for this event
                    currentEventPhotos = eventPhotos.map(el => ({
                        url: el.querySelector('img').src,
                        caption: el.querySelector('.bento-title')?.textContent || '',
                        category: el.querySelector('.bento-badge')?.textContent || ''
                    }));

                    openLightbox(photoIndex);
                });
            });

            // Add show more handlers
            document.querySelectorAll('.event-show-more').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const eventGroup = btn.closest('.event-group');
                    const eventName = btn.dataset.event;

                    // Find all photos for this event and show them
                    const fullEventGroup = eventGroups.find(g => g.name === eventName);
                    if (fullEventGroup) {
                        const bentoGrid = eventGroup.querySelector('.bento-grid');
                        bentoGrid.innerHTML = fullEventGroup.photos.map((photo, i) =>
                            renderBentoItem(photo, i, fullEventGroup.photos.length, 0)
                        ).join('');
                        btn.remove();

                        // Re-add click handlers
                        bentoGrid.querySelectorAll('.bento-item').forEach(item => {
                            item.addEventListener('click', () => {
                                currentEventPhotos = fullEventGroup.photos.map(p => ({
                                    url: p.url,
                                    caption: p.caption || '',
                                    category: p.category || ''
                                }));
                                const items = Array.from(bentoGrid.querySelectorAll('.bento-item'));
                                openLightbox(items.indexOf(item));
                            });
                        });
                    }
                });
            });
        }

        // Filter gallery
        function filterGallery(filter) {
            currentFilter = filter;

            if (filter === 'all') {
                renderGallery(allPhotos);
            } else {
                const filtered = allPhotos.filter(p =>
                    (p.category || '').toLowerCase() === filter.toLowerCase()
                );
                renderGallery(filtered);
            }
        }

        // Load gallery from API (Supabase - existing)
        async function loadGallery() {
            try {
                loadingEl.style.display = 'block';
                eventsGallery.innerHTML = '';

                const response = await dataService.getGallery({ limit: 100 });

                // Handle both formats
                const photos = response.items || response.data || (Array.isArray(response) ? response : []);
                allPhotos = photos;

                loadingEl.style.display = 'none';
                renderGallery(photos);
            } catch (error) {
                console.error('Failed to load gallery:', error);
                loadingEl.style.display = 'none';

                // Show error message with retry option
                eventsGallery.innerHTML = `
                    <div class="center-text py-8" style="grid-column: 1 / -1;">
                        <p class="text-muted">Unable to load gallery. Please check if the server is running.</p>
                        <button class="btn btn-secondary mt-4" onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        // Load gallery from Google Drive folder
        async function loadDriveGallery(folderUrl) {
            try {
                loadingEl.style.display = 'block';
                eventsGallery.innerHTML = '';

                const response = await dataService.getDriveGallery(folderUrl);

                if (!response.success) {
                    throw new Error(response.error || 'Failed to load from Drive');
                }

                // Transform Drive images to gallery format
                const photos = (response.images || []).map(img => ({
                    id: img.id,
                    url: img.previewUrl || img.url,
                    caption: img.name.replace(/\.[^/.]+$/, ''), // Remove extension
                    category: 'photo',
                    event_name: 'Google Drive'
                }));

                allPhotos = photos;
                loadingEl.style.display = 'none';
                renderGallery(photos);
            } catch (error) {
                console.error('Failed to load Drive gallery:', error);
                loadingEl.style.display = 'none';

                eventsGallery.innerHTML = `
                    <div class="center-text py-8" style="grid-column: 1 / -1;">
                        <p class="text-muted">${escapeHtml(error.message || 'Unable to load gallery from Google Drive.')}</p>
                        <button class="btn btn-secondary mt-4" onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        // Load gallery from ALL configured Google Drive folders
        async function loadAllDriveFolders() {
            try {
                loadingEl.style.display = 'block';
                eventsGallery.innerHTML = '';

                const response = await fetch('/api/v1/gallery/drive/all');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load gallery');
                }

                // Use images array from response - already has event_name and category
                const photos = (data.images || []).map(img => ({
                    id: img.id,
                    url: img.previewUrl || img.url,
                    caption: img.name?.replace(/\.[^/.]+$/, '') || '', // Remove extension
                    category: img.category || 'event',
                    event_name: img.event_name || 'Gallery'
                }));

                allPhotos = photos;
                loadingEl.style.display = 'none';
                renderGallery(photos);

            } catch (error) {
                console.error('Failed to load gallery:', error);
                loadingEl.style.display = 'none';

                eventsGallery.innerHTML = `
                    <div class="center-text py-8" style="grid-column: 1 / -1;">
                        <p class="text-muted">${escapeHtml(error.message || 'Unable to load gallery.')}</p>
                        <button class="btn btn-secondary mt-4" onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        // Lightbox functions
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightbox();
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function updateLightbox() {
            const photo = currentEventPhotos[currentLightboxIndex];
            if (!photo) return;

            lightboxImg.src = photo.url;
            lightboxCaption.textContent = photo.caption;
            lightboxBadge.textContent = photo.category;
            lightboxCounter.textContent = `${currentLightboxIndex + 1} / ${currentEventPhotos.length}`;
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            document.body.style.overflow = '';
        }

        function prevPhoto() {
            currentLightboxIndex = (currentLightboxIndex - 1 + currentEventPhotos.length) % currentEventPhotos.length;
            updateLightbox();
        }

        function nextPhoto() {
            currentLightboxIndex = (currentLightboxIndex + 1) % currentEventPhotos.length;
            updateLightbox();
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterGallery(btn.dataset.filter);
            });
        });

        document.querySelector('.lightbox-close')?.addEventListener('click', closeLightbox);
        document.querySelector('.lightbox-prev')?.addEventListener('click', prevPhoto);
        document.querySelector('.lightbox-next')?.addEventListener('click', nextPhoto);

        lightbox?.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display !== 'flex') return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevPhoto();
            if (e.key === 'ArrowRight') nextPhoto();
        });

        // Theme toggle
        function setupThemeToggle() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;

            const updateIcon = () => {
                const isDark = store.getState().theme === 'dark';
                btn.innerHTML = isDark
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
            };

            updateIcon();
            btn.addEventListener('click', () => {
                store.toggleTheme();
                updateIcon();
            });
        }

        // Initialize
        initAnimations();
        setupThemeToggle();
        // Load images from all configured Drive folders
        loadAllDriveFolders();
    </script>

    <style>
        /* === Page Header === */
        [data-theme="light"] .page-header {
            text-align: center;
        }

        [data-theme="dark"] .page-header {
            text-align: left;
        }

        /* === Filters === */
        .gallery-filters {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-top: var(--space-8);
        }

        [data-theme="light"] .gallery-filters {
            justify-content: center;
        }

        [data-theme="dark"] .gallery-filters {
            justify-content: flex-start;
        }

        .filter-btn {
            padding: var(--space-2) var(--space-4);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            transition: all var(--duration-base) var(--ease-default);
        }

        [data-theme="light"] .filter-btn {
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
        }

        [data-theme="light"] .filter-btn:hover {
            color: var(--text-primary);
            border-color: var(--primary);
        }

        [data-theme="light"] .filter-btn.active {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: transparent;
        }

        [data-theme="dark"] .filter-btn {
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
        }

        [data-theme="dark"] .filter-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        [data-theme="dark"] .filter-btn.active {
            color: var(--bg-body);
            background: var(--primary);
            border-color: var(--primary);
        }

        /* === Events Gallery === */
        .events-gallery {
            display: flex;
            flex-direction: column;
            gap: var(--space-12);
        }

        /* === Event Group === */
        .event-group {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .event-group:nth-child(1) {
            animation-delay: 0s;
        }

        .event-group:nth-child(2) {
            animation-delay: 0.1s;
        }

        .event-group:nth-child(3) {
            animation-delay: 0.2s;
        }

        .event-group:nth-child(4) {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-header {
            margin-bottom: var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border-default);
        }

        .event-header-content {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .event-category-badge {
            padding: var(--space-1) var(--space-3);
            font-size: var(--text-xs);
            font-weight: var(--font-semibold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: var(--radius-full);
        }

        .event-category-hackathon {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .event-category-workshop {
            background: rgba(6, 214, 160, 0.15);
            color: var(--primary);
        }

        .event-category-meetup {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .event-category-celebration {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
        }

        .event-title {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--text-primary);
        }

        .event-photo-count {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        /* === Bento Grid === */
        .bento-grid {
            display: grid;
            gap: var(--space-3);
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 160px;
            }
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 140px;
            }
        }

        @media (max-width: 480px) {
            .bento-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 200px;
            }
        }

        /* === Bento Items === */
        .bento-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.95);
            animation: bentoIn 0.5s ease forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes bentoIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .bento-span-large {
            grid-column: span 2;
            grid-row: span 2;
        }

        .bento-span-wide {
            grid-column: span 2;
        }

        .bento-span-tall {
            grid-row: span 2;
        }

        @media (max-width: 768px) {

            .bento-span-large,
            .bento-span-wide {
                grid-column: span 2;
            }

            .bento-span-tall {
                grid-row: span 1;
            }
        }

        @media (max-width: 480px) {

            .bento-span-large,
            .bento-span-wide,
            .bento-span-tall {
                grid-column: span 1;
                grid-row: span 1;
            }
        }

        [data-theme="light"] .bento-item {
            border-radius: var(--radius-xl);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .bento-item {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-default);
        }

        .bento-item-inner {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .bento-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .bento-item:hover .bento-img {
            transform: scale(1.08);
        }

        .bento-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.3) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: var(--space-4);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bento-item:hover .bento-overlay {
            opacity: 1;
        }

        .bento-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            background: var(--primary);
            color: var(--bg-body);
            border-radius: var(--radius-sm);
            text-transform: capitalize;
            margin-bottom: var(--space-2);
            width: fit-content;
        }

        .bento-title {
            color: white;
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            line-height: 1.3;
        }

        .bento-span-large .bento-title {
            font-size: var(--text-lg);
        }

        .bento-zoom {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            color: var(--text-primary);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .bento-item:hover .bento-zoom {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* === Show More Button === */
        .event-show-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            padding: var(--space-3) var(--space-6);
            margin-top: var(--space-4);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--text-muted);
            background: transparent;
            border: 1px dashed var(--border-default);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-show-more:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(6, 214, 160, 0.05);
        }

        /* === Lightbox === */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
            background: rgba(0, 0, 0, 0.95);
        }

        .lightbox-close {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            padding: var(--space-3);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: var(--space-3);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .lightbox-prev {
            left: var(--space-4);
        }

        .lightbox-next {
            right: var(--space-4);
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--primary);
        }

        .lightbox-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            max-height: 85vh;
        }

        .lightbox-modal img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
        }

        .lightbox-info {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-top: var(--space-4);
            flex-wrap: wrap;
            justify-content: center;
        }

        .lightbox-badge {
            padding: 4px 12px;
            font-size: var(--text-xs);
            font-weight: var(--font-semibold);
            background: var(--primary);
            color: var(--bg-body);
            border-radius: var(--radius-full);
            text-transform: capitalize;
        }

        .lightbox-caption {
            color: white;
            font-size: var(--text-lg);
            margin: 0;
        }

        .lightbox-counter {
            color: var(--text-muted);
            font-size: var(--text-sm);
            font-family: var(--font-mono);
        }
    </style>
</body>
