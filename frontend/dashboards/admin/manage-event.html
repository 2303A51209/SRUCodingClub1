<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event | Admin Dashboard</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .split-view {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: var(--space-6);
            align-items: start;
        }

        .vertical-tabs {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .v-tab-btn {
            text-align: left;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-weight: var(--font-medium);
            transition: all 0.2s;
            cursor: pointer;
        }

        .v-tab-btn:hover {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .v-tab-btn.active {
            background: var(--primary-subtle);
            color: var(--primary);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        textarea.code-font {
            font-family: monospace;
            font-size: 13px;
            white-space: pre;
        }
    </style>
</head>

<body>
    <div class="dashboard" id="dashboard">
        <!-- Sidebar (Simplified insertion via JS/Template or just hardcoded for now) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo">
                    <div class="logo-icon">CC</div>
                    <span>Coding Club</span>
                </a>
                <span class="badge badge-error text-xs">ADMIN</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboards/admin/index.html" class="sidebar-link">Dashboard</a>
                <a href="/dashboards/admin/users.html" class="sidebar-link">Users</a>
                <a href="/dashboards/admin/events.html" class="sidebar-link active">Events</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div class="flex items-center gap-4">
                    <a href="/dashboards/admin/events.html" class="btn btn-ghost btn-sm">← Back</a>
                    <div>
                        <h1 class="dashboard-title" id="page-title">Create New Event</h1>
                    </div>
                </div>
                <div class="nav-actions">
                    <button class="btn btn-primary" id="save-btn">Save Changes</button>
                    <button class="theme-toggle">Theme</button>
                </div>
            </header>

            <div class="split-view mt-6">
                <!-- Tabs -->
                <div class="card p-4">
                    <nav class="vertical-tabs">
                        <button class="v-tab-btn active" data-tab="overview">Overview</button>
                        <button class="v-tab-btn" data-tab="content">Rich Content</button>
                        <button class="v-tab-btn" data-tab="config">Configuration</button>
                        <button class="v-tab-btn" data-tab="registrations" id="tab-reg-btn">Registrations</button>
                    </nav>
                </div>

                <!-- Content -->
                <div class="card p-6 min-h-screen">
                    <form id="event-form">

                        <!-- TAB: OVERVIEW -->
                        <div class="tab-panel active" id="tab-overview">
                            <h2 class="text-lg font-semibold mb-4">Basic Information</h2>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Event Title</label>
                                    <input type="text" name="title" class="input w-full" required>
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Type</label>
                                    <select name="event_type" class="input w-full">
                                        <option value="hackathon">Hackathon</option>
                                        <option value="workshop">Workshop</option>
                                        <option value="meetup">Meetup</option>
                                        <option value="talk">Tech Talk</option>
                                    </select>
                                </div>
                                <div class="form-group span-2">
                                    <label class="block text-sm mb-1">Tagline</label>
                                    <input type="text" name="tagline" class="input w-full"
                                        placeholder="Short catchy description">
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Start Date</label>
                                    <input type="datetime-local" name="start_date" class="input w-full" required>
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">End Date</label>
                                    <input type="datetime-local" name="end_date" class="input w-full">
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Status</label>
                                    <select name="status" class="input w-full">
                                        <option value="draft">Draft</option>
                                        <option value="upcoming">Upcoming</option>
                                        <option value="published">Published</option>
                                        <option value="ongoing">Ongoing</option>
                                        <option value="completed">Completed</option>
                                        <option value="cancelled">Cancelled</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Capacity</label>
                                    <input type="number" name="capacity" class="input w-full">
                                </div>
                                <div class="form-group span-2">
                                    <label class="block text-sm mb-1">Location</label>
                                    <input type="text" name="location" class="input w-full"
                                        placeholder="Online or Address">
                                </div>
                                <div class="form-group span-2">
                                    <label class="block text-sm mb-1">Simple Description</label>
                                    <textarea name="description" class="input w-full h-24"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- TAB: CONTENT -->
                        <div class="tab-panel" id="tab-content">
                            <h2 class="text-lg font-semibold mb-4">Rich Content</h2>
                            <p class="text-sm text-secondary mb-4">Enter content as JSON or Markdown/Text where
                                appropriate.</p>

                            <div class="form-group mb-4">
                                <label class="block text-sm mb-1">Detailed Description (Rich JSON/HTML)</label>
                                <textarea name="description_rich" class="input w-full h-32 code-font"></textarea>
                            </div>

                            <div class="form-group mb-4">
                                <label class="block text-sm mb-1">Rules (JSON Array)</label>
                                <textarea name="rules" class="input w-full h-32 code-font"
                                    placeholder='["Rule 1", "Rule 2"]'></textarea>
                            </div>

                            <div class="form-group mb-4">
                                <label class="block text-sm mb-1">Schedule (JSON Array)</label>
                                <textarea name="schedule" class="input w-full h-32 code-font"
                                    placeholder='[{"time": "10:00", "title": "Opening"}]'></textarea>
                            </div>

                            <div class="form-group mb-4">
                                <label class="block text-sm mb-1">Prizes (JSON)</label>
                                <textarea name="prizes" class="input w-full h-32 code-font"></textarea>
                            </div>
                        </div>

                        <!-- TAB: CONFIG -->
                        <div class="tab-panel" id="tab-config">
                            <h2 class="text-lg font-semibold mb-4">Registration Config</h2>
                            <div class="p-4 bg-surface-elevated rounded-lg mb-4">
                                <label class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" name="cfg_allow_teams"> Allow Teams
                                </label>
                                <label class="flex items-center gap-2 mb-2">
                                    <input type="checkbox" name="cfg_allow_solo"> Allow Solo
                                </label>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Max Team Size</label>
                                    <input type="number" name="cfg_max_team_size" class="input w-full">
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Min Team Size</label>
                                    <input type="number" name="cfg_min_team_size" class="input w-full">
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Reg. Start</label>
                                    <input type="datetime-local" name="cfg_reg_start" class="input w-full">
                                </div>
                                <div class="form-group">
                                    <label class="block text-sm mb-1">Reg. End</label>
                                    <input type="datetime-local" name="cfg_reg_end" class="input w-full">
                                </div>
                            </div>
                        </div>

                    </form> <!-- End Form -->

                    <!-- TAB: REGISTRATIONS (Outside Form) -->
                    <div class="tab-panel" id="tab-registrations">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-semibold">Registrations</h2>
                            <button class="btn btn-ghost btn-sm" onclick="loadRegistrations()">Refresh</button>
                        </div>

                        <div class="data-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Details</th>
                                        <th>Team</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="reg-table-body">
                                    <tr>
                                        <td colspan="5" class="text-center py-4">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import dataService from '/js/core/data.js';
        import store from '/js/core/store.js';
        import { $ } from '/js/utils/dom.js';
        import routeGuard from '/js/guards/routeGuard.js';

        store.initTheme();

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');
        const isNew = !eventId;

        const form = document.getElementById('event-form');

        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin'] });
            if (!allowed) return;

            if (isNew) {
                document.getElementById('page-title').textContent = 'Create New Event';
                document.getElementById('tab-reg-btn').style.display = 'none';
            } else {
                document.getElementById('page-title').textContent = 'Edit Event';
                await loadEventData();
                await loadRegistrations();
            }

            setupTabs();

            document.getElementById('save-btn').addEventListener('click', saveEvent);
            window.loadRegistrations = loadRegistrations; // Expose global
            window.verifyReg = verifyReg;
            window.rejectReg = rejectReg;
        }

        function setupTabs() {
            const btns = document.querySelectorAll('.v-tab-btn');
            const panels = document.querySelectorAll('.tab-panel');

            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    btns.forEach(b => b.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
                });
            });
        }

        async function loadEventData() {
            try {
                const event = await dataService.getEvent(eventId);
                if (!event) return;

                // Populate Form
                const f = form;
                f.title.value = event.title;
                f.tagline.value = event.tagline || '';
                // f.event_type.value = event.event_type || 'hackathon'; // field mismatch in schema vs api? 
                // api schema has NO event_type. DB has NO event_type? 
                // Wait, implementation plan enhanced events schema had text/rich. 
                // event_type exists in Front? 
                // I'll assume it's stored in config or tag? 
                // For now, let's just ignore if mismatch.

                if (event.start_date) f.start_date.value = new Date(event.start_date).toISOString().slice(0, 16);
                if (event.end_date) f.end_date.value = new Date(event.end_date).toISOString().slice(0, 16);
                f.status.value = event.status;
                f.capacity.value = event.capacity || event.max_participants || '';
                f.location.value = event.location || '';
                f.description.value = event.description || '';

                // Rich Content (JSON Stringify)
                f.description_rich.value = JSON.stringify(event.description_rich || {}, null, 2);
                f.rules.value = JSON.stringify(event.rules || [], null, 2);
                f.schedule.value = JSON.stringify(event.schedule || [], null, 2);
                f.prizes.value = JSON.stringify(event.prizes || {}, null, 2);

                // Config
                const cfg = event.registration_config || {};
                f.cfg_allow_teams.checked = cfg.allow_teams !== false;
                f.cfg_allow_solo.checked = cfg.allow_solo !== false;
                f.cfg_max_team_size.value = cfg.max_team_size || '';
                f.cfg_min_team_size.value = cfg.min_team_size || '';
                if (cfg.registration_start) f.cfg_reg_start.value = new Date(cfg.registration_start).toISOString().slice(0, 16);
                if (cfg.registration_end) f.cfg_reg_end.value = new Date(cfg.registration_end).toISOString().slice(0, 16);

            } catch (err) {
                console.error(err);
                alert('Failed to load event data');
            }
        }

        async function saveEvent() {
            try {
                const fd = new FormData(form);
                const data = {
                    title: fd.get('title'),
                    tagline: fd.get('tagline'),
                    start_date: fd.get('start_date') ? new Date(fd.get('start_date')).toISOString() : null,
                    end_date: fd.get('end_date') ? new Date(fd.get('end_date')).toISOString() : null,
                    status: fd.get('status'),
                    capacity: fd.get('capacity') ? parseInt(fd.get('capacity')) : null,
                    location: fd.get('location'),
                    description: fd.get('description'),

                    // JSON Fields
                    description_rich: parseJSON(fd.get('description_rich')),
                    rules: parseJSON(fd.get('rules')),
                    schedule: parseJSON(fd.get('schedule')),
                    prizes: parseJSON(fd.get('prizes')),

                    // Config
                    registration_config: {
                        allow_teams: fd.get('cfg_allow_teams') === 'on',
                        allow_solo: fd.get('cfg_allow_solo') === 'on',
                        max_team_size: fd.get('cfg_max_team_size') ? parseInt(fd.get('cfg_max_team_size')) : null,
                        min_team_size: fd.get('cfg_min_team_size') ? parseInt(fd.get('cfg_min_team_size')) : null,
                        registration_start: fd.get('cfg_reg_start') ? new Date(fd.get('cfg_reg_start')).toISOString() : null,
                        registration_end: fd.get('cfg_reg_end') ? new Date(fd.get('cfg_reg_end')).toISOString() : null,
                    }
                };

                if (isNew) {
                    const res = await dataService.createEvent(data);
                    window.location.href = `/dashboards/admin/manage-event.html?id=${res.data.id}`;
                } else {
                    await dataService.updateEvent(eventId, data);
                    alert('Saved successfully');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to save: ' + err.message);
            }
        }

        function parseJSON(str) {
            try {
                return str ? JSON.parse(str) : null;
            } catch (e) {
                return str; // Return as string if not valid JSON (fallback)
            }
        }

        async function loadRegistrations() {
            if (isNew) return;
            try {
                const res = await dataService.getEventRegistrations(eventId);
                const regs = res.data || [];

                const tbody = document.getElementById('reg-table-body');
                tbody.innerHTML = '';

                if (regs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No registrations yet.</td></tr>';
                    return;
                }

                regs.forEach(reg => {
                    const row = document.createElement('tr');
                    const user = reg.users || {};
                    const team = reg.teams || {};

                    row.innerHTML = `
                        <td>
                            <div class="font-medium">${user.full_name || 'Unknown'}</div>
                            <div class="text-xs text-muted">${user.email}</div>
                        </td>
                        <td>
                            <div class="text-xs">
                                Phone: ${user.phone || '-'}<br>
                                Repo: ${reg.submission_data?.portfolio || '-'}
                            </div>
                        </td>
                        <td>
                            ${team.name ? `<div class="font-medium">${team.name}</div><div class="text-xs text-mono">${team.code}</div>` : '<span class="text-muted">Solo</span>'}
                        </td>
                        <td>
                            <span class="badge ${reg.status === 'verified' ? 'badge-success' : 'badge-warning'} text-xs">${reg.status}</span>
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <button class="btn btn-ghost btn-xs text-success" onclick="verifyReg('${reg.id}')">✓</button>
                                <button class="btn btn-ghost btn-xs text-error" onclick="rejectReg('${reg.id}')">✗</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('reg-table-body').innerHTML = '<tr><td colspan="5" class="text-error">Failed to load registrations</td></tr>';
            }
        }

        async function verifyReg(id) {
            if (!confirm('Verify this registration?')) return;
            try {
                await dataService.updateRegistrationStatus(id, { status: 'verified', verified: true });
                loadRegistrations();
            } catch (e) { alert(e.message); }
        }

        async function rejectReg(id) {
            if (!confirm('Reject this registration?')) return;
            try {
                await dataService.updateRegistrationStatus(id, { status: 'rejected', verified: false });
                loadRegistrations();
            } catch (e) { alert(e.message); }
        }

        init();

        // Setup Theme Toggle
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.addEventListener('click', () => store.toggleTheme());
    </script>
</body>

</html>
