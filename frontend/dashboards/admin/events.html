<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage Events - Admin Dashboard">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="/css/main.css">

    <title>Manage Events | Admin Dashboard</title>
</head>

<body>
    <!-- Page Loader -->
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading events...</p>
    </div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo">
                    <div class="logo-icon">CC</div>
                    <span>Coding Club</span>
                </a>
                <span class="badge"
                    style="background: var(--error); color: white; font-size: 10px; padding: 2px 6px;">ADMIN</span>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p>
                    <a href="/dashboards/admin/index.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Dashboard
                    </a>
                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Manage</p>
                    <a href="/dashboards/admin/users.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
                        </svg>
                        Users
                    </a>
                    <a href="/dashboards/admin/events.html" class="sidebar-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        Events
                    </a>
                    <a href="/dashboards/admin/gallery.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <polyline points="21 15 16 10 5 21" />
                        </svg>
                        Gallery
                    </a>
                    <a href="/dashboards/admin/announcements.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>
                        Announcements
                    </a>
                </div>

                <div class="sidebar-footer">
                    <button class="btn btn-ghost w-full" id="logout-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                        Logout
                    </button>
                </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Header -->
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Manage Events</h1>
                    <p class="dashboard-subtitle">Create and edit hackathons, workshops, and meetups.</p>
                </div>
                <div class="nav-actions">
                    <button class="theme-toggle" aria-label="Toggle theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                    </button>
                    <a href="/dashboards/admin/manage-event.html?action=new" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Create Event
                    </a>
                </div>
            </header>

            <!-- Events Table -->
            <section class="card mt-6">
                <div class="card-body">
                    <div class="data-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Stats</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="events-table-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div id="events-empty" class="text-center py-8 hidden">
                        <p class="text-muted">No events found.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import auth from '/js/core/auth.js';
        import routeGuard from '/js/guards/routeGuard.js';
        import store from '/js/core/store.js';
        import dataService from '/js/core/data.js';
        import { $ } from '/js/utils/dom.js';

        store.initTheme();

        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin'] });
            if (!allowed) return;

            await loadEvents();

            $('#page-loader').style.display = 'none';
            $('#dashboard').style.display = 'grid';

            setupThemeToggle();
            setupLogout();
        }

        async function loadEvents() {
            try {
                // Fetch all events (no limit)
                const events = await dataService.getEvents({ limit: 100 });
                const list = events.events || events || []; // consistent check

                const tbody = document.getElementById('events-table-body');
                tbody.innerHTML = '';

                if (list.length === 0) {
                    document.getElementById('events-empty').classList.remove('hidden');
                    return;
                }

                list.forEach(event => {
                    const row = document.createElement('tr');

                    const date = new Date(event.start_date || event.date).toLocaleDateString();
                    const statusClass = getStatusClass(event.status);

                    row.innerHTML = `
                        <td>
                            <div class="font-medium">${event.title}</div>
                            <div class="text-xs text-muted">${event.event_type}</div>
                        </td>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${event.status}</span></td>
                        <td>
                            <div class="text-xs">
                                Capacity: ${event.max_participants || 'Unl.'}<br>
                                Registered: ${event.registrations?.[0]?.count || 0}
                            </div>
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <a href="/dashboards/admin/manage-event.html?id=${event.id}" class="btn btn-ghost btn-xs">Manage</a>
                                <a href="/event-details.html?id=${event.id}" target="_blank" class="btn btn-ghost btn-xs">View</a>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                alert('Failed to load events');
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'published': return 'active';
                case 'upcoming': return 'active';
                case 'draft': return 'pending';
                case 'completed': return 'muted';
                default: return '';
            }
        }

        function setupThemeToggle() {
            // ... reuse logic ...
            const btn = $('.theme-toggle');
            if (btn) btn.addEventListener('click', () => store.toggleTheme());
        }

        function setupLogout() {
            const btn = document.getElementById('logout-btn');
            if (btn) btn.addEventListener('click', async () => await auth.logout());
        }

        init();
    </script>

    <style>
        .status-badge {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.muted {
            background: var(--bg-surface);
            color: var(--text-muted);
        }

        .btn-xs {
            padding: 4px 8px;
            font-size: 12px;
        }
    </style>
</body>

</html>
