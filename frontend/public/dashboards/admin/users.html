<!DOCTYPE html>

<body>

    <div class="dashboard" id="dashboard" style="display: none;">

                </a>

                    style="background: var(--error); color: white; font-size: 10px; padding: 2px 6px;">ADMIN</span>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p>
                    <a href="/dashboards/admin/index.html" class="sidebar-link">

                            <polyline points="9 22 9 12 15 12 15 22" />

                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Manage</p>
                    <a href="/dashboards/admin/users.html" class="sidebar-link active">

                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
                        </svg>
                        Users
                    </a>
                    <a href="/dashboards/admin/events.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        Events
                    </a>
                    <a href="/dashboards/admin/gallery.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <polyline points="21 15 16 10 5 21" />
                        </svg>
                        Gallery
                    </a>
                    <a href="/dashboards/admin/announcements.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>
                        Announcements
                    </a>
                </div>

                <div class="sidebar-section">
                    <p class="sidebar-section-title">Settings</p>
                    <a href="/dashboards/admin/settings.html" class="sidebar-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                        </svg>
                        Settings
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-ghost w-full" id="logout-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Header -->
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">User Management</h1>
                    <p class="dashboard-subtitle">Manage all club members</p>
                </div>
                <div class="nav-actions">
                    <button class="theme-toggle" aria-label="Toggle theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Filters and Search -->
            <section class="card mb-6">
                <div class="card-body">
                    <div class="filters-row">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="M21 21l-4.35-4.35" />
                            </svg>
                            <input type="text" id="search-input" placeholder="Search users..." class="search-input">
                        </div>
                        <div class="filter-group">
                            <select id="role-filter" class="filter-select">
                                <option value="">All Roles</option>
                                <option value="admin">Admin</option>
                                <option value="team">Team</option>
                                <option value="member">Member</option>
                            </select>
                        </div>
                        <div class="filter-stats" id="filter-stats">
                            Showing <span id="showing-count">0</span> of <span id="total-count">0</span> users
                        </div>
                    </div>
                </div>
            </section>

            <!-- Users Table -->
            <section class="card">
                <div class="card-body">
                    <div class="data-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Role</th>
                                    <th>Joined</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <tr>
                                    <td colspan="4" class="text-center py-8 text-muted">Loading users...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <button class="btn btn-ghost btn-sm" id="prev-page" disabled>Previous</button>
                        <span class="pagination-info" id="page-info">Page 1 of 1</span>
                        <button class="btn btn-ghost btn-sm" id="next-page" disabled>Next</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Role Change Modal -->
    <div class="modal-overlay" id="role-modal" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Change User Role</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="mb-4">Change role for: <strong id="modal-user-name"></strong></p>
                <div class="form-group">
                    <label for="new-role">New Role</label>
                    <select id="new-role" class="form-input">
                        <option value="member">Member</option>
                        <option value="team">Team</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-confirm">Update Role</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';

        store.initTheme();

        // State
        let users = [];
        let currentPage = 1;
        let totalPages = 1;
        let selectedUserId = null;

        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin'] });
            if (!allowed) return;

            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';

            setupEventListeners();
            await loadUsers();
        }

        function setupEventListeners() {
            // Search
            document.getElementById('search-input').addEventListener('input', debounce(() => {
                currentPage = 1;
                loadUsers();
            }, 300));

            // Role filter
            document.getElementById('role-filter').addEventListener('change', () => {
                currentPage = 1;
                loadUsers();
            });

            // Pagination
            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadUsers();
                }
            });

            document.getElementById('next-page').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadUsers();
                }
            });

            // Modal
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('modal-cancel').addEventListener('click', closeModal);
            document.getElementById('modal-confirm').addEventListener('click', updateRole);
            document.getElementById('role-modal').addEventListener('click', (e) => {
                if (e.target.id === 'role-modal') closeModal();
            });

            // Logout
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await auth.logout();
            });

            // Theme toggle
            document.querySelector('.theme-toggle')?.addEventListener('click', () => {
                store.toggleTheme();
            });
        }

        async function loadUsers() {
            const search = document.getElementById('search-input').value;
            const role = document.getElementById('role-filter').value;
            const token = localStorage.getItem('sb_access_token');

            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    limit: 10,
                    ...(search && { search }),
                    ...(role && { role }),
                });

                const response = await fetch(`/api/v1/admin/users?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load users');

                const result = await response.json();
                users = result.data || [];
                totalPages = result.pagination?.pages || 1;

                renderUsers();
                updatePagination();
                updateStats(result.pagination?.total || users.length);

            } catch (error) {
                console.error('Error loading users:', error);
                showToast('Failed to load users', 'error');
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('users-table-body');

            if (!users.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-8 text-muted">No users found</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr data-user-id="${user.id}">
                    <td>
                        <div class="user-cell">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}" 
                                 alt="" class="user-avatar-sm">
                            <div>
                                <p class="user-name">${user.full_name || 'No name'}</p>
                                <p class="user-email">${user.email}</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="role-badge role-${user.role}">${user.role}</span>
                    </td>
                    <td>${formatDate(user.created_at)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-ghost btn-sm" onclick="openRoleModal('${user.id}', '${user.full_name || user.email}', '${user.role}')">
                                Change Role
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updatePagination() {
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = currentPage >= totalPages;
        }

        function updateStats(total) {
            document.getElementById('showing-count').textContent = users.length;
            document.getElementById('total-count').textContent = total;
        }

        // Modal functions
        window.openRoleModal = function (userId, userName, currentRole) {
            selectedUserId = userId;
            document.getElementById('modal-user-name').textContent = userName;
            document.getElementById('new-role').value = currentRole;
            document.getElementById('role-modal').style.display = 'flex';
        };

        function closeModal() {
            document.getElementById('role-modal').style.display = 'none';
            selectedUserId = null;
        }

        async function updateRole() {
            const newRole = document.getElementById('new-role').value;
            const token = localStorage.getItem('sb_access_token');

            try {
                const response = await fetch(`/api/v1/admin/users/${selectedUserId}/role`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ role: newRole })
                });

                if (!response.ok) throw new Error('Failed to update role');

                showToast('Role updated successfully', 'success');
                closeModal();
                await loadUsers();

            } catch (error) {
                console.error('Error updating role:', error);
                showToast('Failed to update role', 'error');
            }
        }

        // Utility functions
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function debounce(fn, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), delay);
            };
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        init();
    </script>

    <style>
        .filters-row {
            display: flex;
            gap: var(--space-4);
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            flex: 1;
            min-width: 200px;
        }

        .search-box svg {
            color: var(--text-muted);
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            flex: 1;
            font-size: var(--text-sm);
        }

        .filter-select {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            color: var(--text-primary);
            font-size: var(--text-sm);
            cursor: pointer;
        }

        .filter-stats {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-left: auto;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .user-avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
        }

        .user-name {
            font-weight: var(--font-medium);
            color: var(--text-primary);
        }

        .user-email {
            font-size: var(--text-xs);
            color: var(--text-muted);
        }

        .role-badge {
            display: inline-flex;
            padding: var(--space-1) var(--space-3);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            border-radius: var(--radius-full);
            text-transform: capitalize;
        }

        .role-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .role-team {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .role-member {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .action-buttons {
            display: flex;
            gap: var(--space-2);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-4);
            margin-top: var(--space-6);
            padding-top: var(--space-4);
            border-top: 1px solid var(--glass-border);
        }

        .pagination-info {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-header h3 {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: var(--space-6);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-6);
            border-top: 1px solid var(--glass-border);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3);
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        /* Toast Styles */
        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            z-index: 1100;
        }

        .toast {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast-error {
            border-color: var(--error);
            color: var(--error);
        }

        .mb-4 {
            margin-bottom: var(--space-4);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }

        .py-8 {
            padding-top: var(--space-8);
            padding-bottom: var(--space-8);
        }
    </style>
</body>
