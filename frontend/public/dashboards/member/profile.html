<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile - SR University Coding Club">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Profile | Member Dashboard</title>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading...</p>
    </div>
    <div class="dashboard" id="dashboard" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header"><a href="../../index.html" class="logo">
                    <div class="logo-icon">>_</div><span>srucc</span>
                </a><span class="badge"
                    style="background: var(--success); color: white; font-size: 10px; padding: 2px 6px;">MEMBER</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p><a href="/dashboards/member/index.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>Dashboard</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Explore</p><a href="/dashboards/member/events.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                        </svg>Events</a><a href="/dashboards/member/gallery.html" class="sidebar-link"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>Gallery</a><a href="/dashboards/member/announcements.html" class="sidebar-link"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>Announcements</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Personal</p><a href="/dashboards/member/profile.html"
                        class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>Profile</a>
                </div>
            </nav>
            <div class="sidebar-footer"><button class="btn btn-ghost w-full" id="logout-btn"><svg viewBox="0 0 24 24"
                        width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>Logout</button></div>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Profile</h1>
                    <p class="dashboard-subtitle">Manage your account</p>
                </div>
            </header>
            <section class="card mb-6">
                <div class="card-body">
                    <div class="profile-header">
                        <img id="profile-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default"
                            alt="Avatar" class="profile-avatar">
                        <div>
                            <h2 id="profile-name" class="profile-name">Loading...</h2>
                            <p id="profile-email" class="profile-email">...</p>
                            <span id="profile-role" class="role-badge role-member">Member</span>
                        </div>
                    </div>
                </div>
            </section>
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Edit Profile</h2>
                </div>
                <div class="card-body">
                    <form id="profile-form" class="profile-form">
                        <div class="form-group"><label for="full-name">Full Name</label><input type="text"
                                id="full-name" class="form-input" placeholder="Your name"></div>
                        <div class="form-group"><label for="bio">Bio</label><textarea id="bio" class="form-input"
                                rows="3" placeholder="Tell us about yourself..."></textarea></div>
                        <div class="form-row">
                            <div class="form-group"><label for="github">GitHub</label><input type="text" id="github"
                                    class="form-input" placeholder="username"></div>
                            <div class="form-group"><label for="linkedin">LinkedIn</label><input type="text"
                                    id="linkedin" class="form-input" placeholder="username"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';
        store.initTheme();
        let user = null;
        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin', 'team', 'member'] });
            if (!allowed) return;
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('profile-form').addEventListener('submit', saveProfile);
            document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
            loadProfile();
        }
        function loadProfile() {
            try {
                const userData = JSON.parse(localStorage.getItem('sb_user') || '{}');
                user = userData;
                document.getElementById('profile-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${userData.email || 'default'}`;
                document.getElementById('profile-name').textContent = userData.full_name || userData.user_metadata?.full_name || 'Member';
                document.getElementById('profile-email').textContent = userData.email || '';
                document.getElementById('profile-role').textContent = userData.role || 'member';
                document.getElementById('full-name').value = userData.full_name || userData.user_metadata?.full_name || '';
                document.getElementById('bio').value = userData.bio || '';
                document.getElementById('github').value = userData.github || '';
                document.getElementById('linkedin').value = userData.linkedin || '';
            } catch (error) { console.error(error); }
        }
        async function saveProfile(e) {
            e.preventDefault();
            const data = { full_name: document.getElementById('full-name').value, bio: document.getElementById('bio').value, github: document.getElementById('github').value, linkedin: document.getElementById('linkedin').value };
            try {
                const token = localStorage.getItem('sb_access_token');
                const response = await fetch('/api/v1/users/me', { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(data) });
                if (response.ok) {
                    localStorage.setItem('sb_user', JSON.stringify({ ...user, ...data }));
                    showToast('Profile updated', 'success');
                } else { showToast('Saved locally', 'success'); }
            } catch (error) { showToast('Saved locally', 'success'); }
        }
        function showToast(message, type = 'info') { const container = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.className = `toast toast-${type}`; toast.textContent = message; container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10); setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000); }
        init();
    </script>
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: var(--space-6);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-full);
            border: 3px solid var(--primary);
        }

        .profile-name {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-1);
        }

        .profile-email {
            color: var(--text-muted);
            margin-bottom: var(--space-2);
        }

        .role-badge {
            display: inline-flex;
            padding: var(--space-1) var(--space-3);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            border-radius: var(--radius-full);
            text-transform: capitalize;
        }

        .role-member {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .profile-form {
            max-width: 500px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3);
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        textarea.form-input {
            resize: vertical;
        }

        .toast-container {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            z-index: 1100;
        }

        .toast {
            padding: var(--space-3) var(--space-4);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s;
            margin-top: var(--space-2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-color: var(--success);
            color: var(--success);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }
    </style>
</body>

</html>
