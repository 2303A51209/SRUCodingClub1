<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gallery - SR University Coding Club">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Gallery | Member Dashboard</title>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-logo">
            <div class="spinner spinner-xl"></div>
        </div>
        <p class="loader-text">Loading...</p>
    </div>
    <div class="dashboard" id="dashboard" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header"><a href="../../index.html" class="logo">
                    <div class="logo-icon">>_</div><span>srucc</span>
                </a><span class="badge"
                    style="background: var(--success); color: white; font-size: 10px; padding: 2px 6px;">MEMBER</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Overview</p><a href="/dashboards/member/index.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>Dashboard</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Explore</p><a href="/dashboards/member/events.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                        </svg>Events</a><a href="/dashboards/member/gallery.html" class="sidebar-link active"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>Gallery</a><a href="/dashboards/member/announcements.html" class="sidebar-link"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 17H2a3 3 0 003-3V9a7 7 0 0114 0v5a3 3 0 003 3zm-8.27 4a2 2 0 01-3.46 0" />
                        </svg>Announcements</a>
                </div>
                <div class="sidebar-section">
                    <p class="sidebar-section-title">Personal</p><a href="/dashboards/member/profile.html"
                        class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>Profile</a>
                </div>
            </nav>
            <div class="sidebar-footer"><button class="btn btn-ghost w-full" id="logout-btn"><svg viewBox="0 0 24 24"
                        width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>Logout</button></div>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Gallery</h1>
                    <p class="dashboard-subtitle">Club photos and memories</p>
                </div>
            </header>
            <section class="card mb-6">
                <div class="card-body">
                    <select id="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                        <option value="events">Events</option>
                        <option value="workshops">Workshops</option>
                        <option value="team">Team</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </section>
            <section class="card">
                <div class="card-body">
                    <div id="gallery-grid" class="gallery-grid">
                        <div class="loading-placeholder">Loading...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <div class="lightbox" id="lightbox" style="display: none;">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightbox-img" src="" alt="">
        <p id="lightbox-caption"></p>
    </div>
    <script type="module">
        import auth from '../../js/core/auth.js';
        import routeGuard from '../../js/guards/routeGuard.js';
        import store from '../../js/core/store.js';
        store.initTheme();
        let images = [];
        async function init() {
            const allowed = await routeGuard.check({ roles: ['admin', 'team', 'member'] });
            if (!allowed) return;
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('category-filter').addEventListener('change', loadGallery);
            document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
            await loadGallery();
        }
        async function loadGallery() {
            const category = document.getElementById('category-filter').value;
            try {
                const params = new URLSearchParams({ limit: 50 });
                if (category) params.append('category', category);
                const response = await fetch(`/api/v1/gallery?${params}`);
                if (!response.ok) throw new Error('Failed');
                const result = await response.json();
                images = result.data || [];
                renderGallery();
            } catch (error) { console.error(error); }
        }
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            if (!images.length) { grid.innerHTML = '<div class="empty-state"><p>No photos yet</p></div>'; return; }
            grid.innerHTML = images.map(img => `<div class="gallery-item" onclick="openLightbox('${img.url}', '${img.caption || ''}')"><img src="${img.url}" alt="${img.caption || ''}" loading="lazy"></div>`).join('');
        }
        window.openLightbox = function (url, caption) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').textContent = caption;
            document.getElementById('lightbox').style.display = 'flex';
        };
        window.closeLightbox = function () { document.getElementById('lightbox').style.display = 'none'; };
        init();
    </script>
    <style>
        .filter-select {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            color: var(--text-primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space-4);
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: var(--space-6);
        }

        .lightbox-close {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
        }

        .lightbox p {
            color: white;
            margin-top: var(--space-4);
            font-size: var(--text-lg);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-12);
            grid-column: 1 / -1;
            color: var(--text-muted);
        }

        .loading-placeholder {
            text-align: center;
            padding: var(--space-8);
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }
    </style>
</body>

</html>
