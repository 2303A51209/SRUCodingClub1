<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SR University Coding Club</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .reset-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-4);
            background: radial-gradient(circle at top right, rgba(var(--primary-rgb), 0.1), transparent 40%),
                radial-gradient(circle at bottom left, rgba(var(--secondary-rgb), 0.1), transparent 40%);
        }

        .reset-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
            justify-content: center;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: var(--text-xl);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-md);
            display: grid;
            place-items: center;
            color: white;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="reset-card">
            <a href="/" class="logo">
                <div class="logo-icon">>_</div>
                <span>srucc</span>
            </a>
            <h2 class="text-xl font-bold text-center mb-6">Set New Password</h2>

            <form id="reset-form">
                <div class="form-group mb-4">
                    <label class="block text-sm font-medium mb-2 text-secondary">New Password</label>
                    <input type="password" id="password"
                        class="w-full p-3 bg-surface border border-glass rounded-lg text-primary" required
                        minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-full">Update Password</button>
            </form>
            <p id="message" class="text-center mt-4 text-sm text-muted"></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Initialize Supabase - Replace with your actual project URL and Anon Key if possible, 
        // or rely on hash fragment handling if using pure auth flow
        // For this simple page, we need to handle the hash fragment.

        async function handleReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            // Get the access token from the URL hash
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');

            if (!accessToken) {
                message.textContent = 'Invalid or expired link.';
                message.className = 'text-center mt-4 text-sm text-error';
                message.style.color = 'var(--error)';
                return;
            }

            try {
                // Call backend API to reset password
                const response = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessToken, password })
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Failed to update password');
                }

                message.textContent = 'Password updated successfully! Redirecting to login...';
                message.className = 'text-center mt-4 text-sm text-success';
                message.style.color = 'var(--success)';

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);

            } catch (error) {
                message.textContent = error.message;
                message.className = 'text-center mt-4 text-sm text-error';
                message.style.color = 'var(--error)';
            }
        }

        document.getElementById('reset-form').addEventListener('submit', handleReset);
    </script>
</body>

</html>
