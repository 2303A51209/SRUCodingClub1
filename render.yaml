# See https://render.com/docs/blueprint-spec for documentation
services:
  - type: web
    name: sr-coding-club-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false  # Set this to your GitHub Pages URL
